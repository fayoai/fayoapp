name: Deploy MIF Smart to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [mif-smart-platform]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Deploy to Cloudflare or temporary preview
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Deploying to the configured Cloudflare account"
            npx wrangler deploy
          else
            echo "Cloudflare account secrets are absent; deploying a temporary, public preview only"
            # Temporary accounts do not permit cron triggers. Retain them for authenticated production deploys.
            node -e "const fs=require('fs');const p='wrangler.jsonc';const x=JSON.parse(fs.readFileSync(p,'utf8'));delete x.triggers;fs.writeFileSync(p,JSON.stringify(x,null,2))"
            npx wrangler deploy --temporary
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

name: Deploy MIF Smart to Cloudflare
concurrency:
  group: mif-smart-platform-production-deploy
  cancel-in-progress: false
on:
  workflow_dispatch:
  push:
    branches: [mif-smart-platform]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Migrate verified signup database tables
        env:
          MIF_DATABASE_URL: ${{ secrets.MIF_DATABASE_URL }}
        run: |
          if [[ -z "$MIF_DATABASE_URL" ]]; then
            echo "::warning::MIF_DATABASE_URL not in GitHub secrets. RAWI signup schema was migrated directly in the connected Neon production database; skipping CI migration."
          else
            node scripts/migrate-rawi-email-company.mjs
          fi
      - name: Initialize incomplete RAWI customer workspaces
        env:
          MIF_DATABASE_URL: ${{ secrets.MIF_DATABASE_URL }}
        run: |
          if [[ -z "$MIF_DATABASE_URL" ]]; then
            echo "::error::MIF_DATABASE_URL is required to prepare tenant databases"
            exit 1
          fi
          node scripts/reconcile-enterprise-tenants.mjs
      - name: Verify Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions Secrets."
            exit 1
          fi
      - name: Deploy only RAWI ERP and MIF SaaS Workers
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MIF_DATABASE_URL: ${{ secrets.MIF_DATABASE_URL }}
          MIF_SESSION_SECRET: ${{ secrets.MIF_SESSION_SECRET }}
          MIF_ADMIN_BOOTSTRAP_TOKEN: ${{ secrets.MIF_ADMIN_BOOTSTRAP_TOKEN }}
          MIF_CONNECTOR_ENCRYPTION_KEY: ${{ secrets.MIF_CONNECTOR_ENCRYPTION_KEY }}
          MIF_PLATFORM_OWNER_EMAIL: ${{ secrets.MIF_PLATFORM_OWNER_EMAIL }}
          MIF_NEON_API_KEY: ${{ secrets.MIF_NEON_API_KEY }}
          MIF_NEON_ORG_ID: ${{ secrets.MIF_NEON_ORG_ID }}
          MIF_SITE_ORIGIN: ${{ vars.MIF_SITE_ORIGIN }}
          MIF_REGISTRATION_ENABLED: ${{ vars.MIF_REGISTRATION_ENABLED }}
          MIF_PUBLIC_CHAT_ENABLED: ${{ vars.MIF_PUBLIC_CHAT_ENABLED }}
          MIF_RESEND_API_KEY: ${{ secrets.MIF_RESEND_API_KEY }}
          MIF_EMAIL_FROM: ${{ vars.MIF_EMAIL_FROM }}
        run: |
          set -euo pipefail
          SECRET_FILE="${RUNNER_TEMP}/mif-worker-secrets.json"
          export SECRET_FILE
          trap 'rm -f "$SECRET_FILE"' EXIT
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const names={
            MIF_DATABASE_URL:'DATABASE_URL',
            MIF_SESSION_SECRET:'SESSION_SECRET',
            MIF_ADMIN_BOOTSTRAP_TOKEN:'ADMIN_BOOTSTRAP_TOKEN',
            MIF_CONNECTOR_ENCRYPTION_KEY:'CONNECTOR_ENCRYPTION_KEY',
            MIF_PLATFORM_OWNER_EMAIL:'PLATFORM_OWNER_EMAIL',
            MIF_NEON_API_KEY:'NEON_API_KEY',
            MIF_NEON_ORG_ID:'NEON_ORG_ID',
            MIF_SITE_ORIGIN:'SITE_ORIGIN',
            MIF_REGISTRATION_ENABLED:'REGISTRATION_ENABLED',
            MIF_PUBLIC_CHAT_ENABLED:'PUBLIC_CHAT_ENABLED',
            MIF_RESEND_API_KEY:'RESEND_API_KEY',
            MIF_EMAIL_FROM:'EMAIL_FROM'
          };
          const values=Object.fromEntries(
            Object.entries(names).filter(([source])=>!!process.env[source]).map(([source,target])=>[target,process.env[source]])
          );
          if(Object.keys(values).length)writeFileSync(process.env.SECRET_FILE,JSON.stringify(values),{mode:0o600});
          console.log('Configured Worker runtime binding names: '+(Object.keys(values).join(', ')||'none; existing Worker secrets will be retained'));
          NODE
          for config in wrangler.enterprise.jsonc wrangler.jsonc; do
            echo "Deploying independently configured Worker: $config"
            if [[ -f "$SECRET_FILE" ]]; then
              npx wrangler deploy --config "$config" --secrets-file "$SECRET_FILE"
            else
              npx wrangler deploy --config "$config"
            fi
          done
      - name: Test active MIF and RAWI ERP Worker boundaries
        run: npm run smoke:surfaces
      - name: Verify guest AI responses on both public Workers
        run: node scripts/smoke-ai-free.mjs
      - name: Verify real database-backed application runtimes
        shell: bash
        env:
          MIF_DATABASE_URL: ${{ secrets.MIF_DATABASE_URL }}
        run: |
          if [[ -n "$MIF_DATABASE_URL" ]]; then
            npm run smoke:runtime
          else
            echo "::warning::Runtime not verified: MIF_DATABASE_URL is not configured; all database-backed screens remain unavailable."
          fi
      - name: Verify RAWI email registration is live after deployment
        shell: bash
        env:
          MIF_RESEND_API_KEY: ${{ secrets.MIF_RESEND_API_KEY }}
          MIF_EMAIL_FROM: ${{ vars.MIF_EMAIL_FROM }}
          MIF_REGISTRATION_ENABLED: ${{ vars.MIF_REGISTRATION_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "${MIF_REGISTRATION_ENABLED}" != "true" ]]; then
            echo "::error::Set repository Actions variable MIF_REGISTRATION_ENABLED=true to activate email signup."
            exit 1
          fi
          if [[ -z "${MIF_RESEND_API_KEY}" ]]; then
            echo "::error::Missing repository Actions Secret MIF_RESEND_API_KEY."
            exit 1
          fi
          if [[ ! "${MIF_EMAIL_FROM}" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
            echo "::error::Set a valid sender under Actions variable MIF_EMAIL_FROM (for example no-reply@fayo.app)."
            exit 1
          fi
          node --input-type=module <<'NODE'
          const target='https://rawi-enterprise.fayosaas.workers.dev/api/public/rawi/status';
          let status;
          for(let i=0;i<5;i++){
           try{
            const response=await fetch(target,{signal:AbortSignal.timeout(12000),headers:{'Cache-Control':'no-cache'}});
            if(!response.ok)throw Error('RAWI status HTTP '+response.status);
            status=await response.json();
            if(status.ok&&status.registration_enabled===true&&status.password_kdf_iterations===100000)break;
           }catch(e){console.log('Registration check attempt '+(i+1)+': '+e.message)}
           if(i<4)await new Promise(resolve=>setTimeout(resolve,2500));
          }
          if(!status?.ok||status.registration_enabled!==true||status.password_kdf_iterations!==100000){
           console.error('::error::RAWI registration is not active in the deployed Cloudflare Worker. Review DATABASE_URL, SESSION_SECRET, Neon API provisioning and email sender settings. AI connector encryption is optional for signup.');
           process.exit(1);
          }
          if(status.workspace_ai_available!==true){console.error('::error::RAWI Workers AI onboarding binding is unavailable in the deployed Enterprise Worker.');process.exit(1)}
          console.log('RAWI email registration, password hashing, and Workers AI onboarding binding are ready.');
          NODE
      - name: Verify real production domain when configured
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MIF_SITE_ORIGIN: ${{ vars.MIF_SITE_ORIGIN }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$MIF_SITE_ORIGIN" ]]; then
            npm run smoke:public -- "$MIF_SITE_ORIGIN"
          else
            echo "Production smoke skipped: no permanent Cloudflare account/domain is configured"
          fi

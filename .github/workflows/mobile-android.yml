name: Android debug build (manual, not Play Store release)
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Deployed HTTPS API origin'
        required: true
        type: string
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: android-actions/setup-android@v3
      - name: Validate origin
        env:
          APP_URL: ${{ inputs.api_base_url }}
        run: node -e "const u=new URL(process.env.APP_URL); if(u.protocol!=='https:') process.exit(1)"
      - name: Install packages and build
        env:
          RAWI_PUBLIC_SITE_URL: ${{ inputs.api_base_url }}
          RAWI_NATIVE_TARGET: enterprise
        run: |
          npm install --no-audit --no-fund
          npm run build
          node scripts/prepare-native.mjs
          npx cap add android
          npx cap sync android
          node scripts/native-icons.mjs
      - name: Build unsigned debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mif-smart-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

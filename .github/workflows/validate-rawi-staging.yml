name: Validate RAWI repository redesign
on:
  push:
    branches: [fix-rawi-dynamic-repositories-20261012]
permissions:
  contents: read
  statuses: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Report staged test status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then STATE=success; else STATE=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" -f context="validation/rawi-repositories" \
            -f description="RAWI generated repository tests and build: $RESULT" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
